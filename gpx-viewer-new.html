<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Track Viewer - Professional Edition</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet Awesome Markers -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1e40af;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        /* New Layout */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Sidebar - File Browser */
        .sidebar {
            width: 320px;
            background: var(--bg-white);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 2px solid var(--primary-color);
        }

        .sidebar-header h4 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .file-item {
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-item:hover {
            border-color: var(--primary-color);
            transform: translateX(4px);
        }

        .file-item.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border-color: var(--primary-dark);
        }

        .file-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .file-meta {
            font-size: 11px;
            opacity: 0.8;
        }

        /* Main Content - Map Preview + Controls */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 16:9 Map Preview Area */
        .map-preview-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-bottom: 2px solid var(--border-color);
        }

        .map-preview {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* Map Controls Overlay */
        .map-overlay-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .map-control-btn {
            background: var(--bg-white);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .map-control-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .map-control-btn i {
            font-size: 16px;
        }

        /* Map Layer Switcher */
        .layer-switcher {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: var(--bg-white);
            padding: 8px;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            display: flex;
            gap: 4px;
        }

        .layer-btn {
            padding: 8px 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-white);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .layer-btn:hover {
            border-color: var(--primary-color);
        }

        .layer-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        /* Controls Panel Below Map */
        .controls-panel {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-white);
            border-top: 1px solid var(--border-color);
        }

        .controls-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            background: var(--bg-light);
        }

        .control-tab {
            flex: 1;
            padding: 14px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .control-tab:hover {
            background: var(--bg-white);
        }

        .control-tab.active {
            background: var(--bg-white);
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
        }

        .control-tab-content {
            padding: 20px;
            display: none;
        }

        .control-tab-content.active {
            display: block;
        }

        /* Element List */
        .element-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .element-item {
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s;
        }

        .element-item:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        .element-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .element-title {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .element-toggle {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .element-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .control-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .control-input {
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .control-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Color Marker Icons */
        .awesome-marker {
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 1200px) {
            .sidebar {
                width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar - File Browser -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h4>
                    <i class="fa-solid fa-map-location-dot" style="color: var(--primary-color);"></i>
                    GPX Viewer Pro
                </h4>
            </div>

            <div class="file-list" id="file-list">
                <div class="text-center p-4 text-secondary">
                    <i class="fa-solid fa-database fa-3x mb-3 d-block" style="opacity: 0.3;"></i>
                    <p>Load database to begin</p>
                    <button class="btn btn-primary btn-sm" onclick="document.getElementById('db-upload').click()">
                        <i class="fa-solid fa-folder-open me-2"></i>Load Database
                    </button>
                    <input type="file" id="db-upload" accept=".sqlite,.db" style="display: none;" onchange="loadDatabase(event)">
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- 16:9 Map Preview -->
            <div class="map-preview-container">
                <div id="map" class="map-preview"></div>

                <!-- Map Layer Switcher -->
                <div class="layer-switcher">
                    <button class="layer-btn active" onclick="switchLayer('osm')" data-layer="osm">
                        <i class="fa-solid fa-map"></i> Street
                    </button>
                    <button class="layer-btn" onclick="switchLayer('satellite')" data-layer="satellite">
                        <i class="fa-solid fa-satellite"></i> Satellite
                    </button>
                    <button class="layer-btn" onclick="switchLayer('hybrid')" data-layer="hybrid">
                        <i class="fa-solid fa-layer-group"></i> Hybrid
                    </button>
                </div>

                <!-- Map Overlay Controls -->
                <div class="map-overlay-controls">
                    <button class="map-control-btn" onclick="exportMapPNG()" title="Export as PNG (2000x1125px)">
                        <i class="fa-solid fa-download"></i>
                        Export PNG
                    </button>
                    <button class="map-control-btn" onclick="autoFitMap()" title="Auto-fit and rotate">
                        <i class="fa-solid fa-maximize"></i>
                        Auto Fit
                    </button>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="controls-panel">
                <div class="controls-tabs">
                    <button class="control-tab active" onclick="switchTab('elements')" data-tab="elements">
                        <i class="fa-solid fa-layer-group me-2"></i>Map Elements
                    </button>
                    <button class="control-tab" onclick="switchTab('tracks')" data-tab="tracks">
                        <i class="fa-solid fa-route me-2"></i>Tracks & Routes
                    </button>
                    <button class="control-tab" onclick="switchTab('waypoints')" data-tab="waypoints">
                        <i class="fa-solid fa-location-dot me-2"></i>Waypoints
                    </button>
                    <button class="control-tab" onclick="switchTab('settings')" data-tab="settings">
                        <i class="fa-solid fa-sliders me-2"></i>Settings
                    </button>
                </div>

                <!-- Elements Tab -->
                <div class="control-tab-content active" id="tab-elements">
                    <h5 class="mb-3">
                        <i class="fa-solid fa-list me-2"></i>All Map Elements
                    </h5>
                    <div class="element-list" id="element-list">
                        <p class="text-secondary text-center py-4">
                            Load a GPX file to see all elements
                        </p>
                    </div>
                </div>

                <!-- Tracks Tab -->
                <div class="control-tab-content" id="tab-tracks">
                    <h5 class="mb-3">
                        <i class="fa-solid fa-route me-2"></i>Tracks & Routes
                    </h5>
                    <div id="tracks-list"></div>
                </div>

                <!-- Waypoints Tab -->
                <div class="control-tab-content" id="tab-waypoints">
                    <h5 class="mb-3">
                        <i class="fa-solid fa-location-dot me-2"></i>Waypoints & POIs
                    </h5>
                    <div id="waypoints-list"></div>
                </div>

                <!-- Settings Tab -->
                <div class="control-tab-content" id="tab-settings">
                    <h5 class="mb-3">
                        <i class="fa-solid fa-sliders me-2"></i>Global Settings
                    </h5>
                    <div class="element-controls">
                        <div class="control-field">
                            <label class="control-label">Export Width (px)</label>
                            <input type="number" class="control-input" id="export-width" value="2000" min="800" max="4000">
                        </div>
                        <div class="control-field">
                            <label class="control-label">Default Line Width</label>
                            <input type="range" class="form-range" id="default-line-width" min="1" max="10" value="4">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Awesome Markers -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.js"></script>

    <!-- html2canvas for PNG export -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <!-- SQL.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

    <script>
        // Global state
        let map = null;
        let currentLayers = {
            osm: null,
            satellite: null,
            hybrid: null
        };
        let currentLayer = 'osm';
        let db = null;
        let currentGPXData = null;
        let allElements = [];

        // Initialize map
        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([51.1657, 10.4515], 6);

            // Add zoom control to bottom right
            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);

            // Initialize tile layers
            currentLayers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            });

            currentLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '© Esri',
                maxZoom: 19
            });

            currentLayers.hybrid = L.layerGroup([
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri'
                }),
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    opacity: 0.3
                })
            ]);

            // Add default layer
            currentLayers.osm.addTo(map);
        }

        // Switch map layer
        function switchLayer(layerName) {
            // Remove current layer
            Object.values(currentLayers).forEach(layer => {
                if (layer && map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }
            });

            // Add new layer
            if (currentLayers[layerName]) {
                currentLayers[layerName].addTo(map);
                currentLayer = layerName;
            }

            // Update UI
            document.querySelectorAll('.layer-btn').forEach(btn => {
                if (btn.dataset.layer === layerName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Switch control tab
        function switchTab(tabName) {
            document.querySelectorAll('.control-tab').forEach(tab => {
                if (tab.dataset.tab === tabName) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            document.querySelectorAll('.control-tab-content').forEach(content => {
                content.classList.remove('active');
            });

            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // Auto-fit map to show all elements
        function autoFitMap() {
            if (!currentGPXData) return;

            const allPoints = [];

            // Collect all track points
            if (currentGPXData.tracks) {
                currentGPXData.tracks.forEach(track => {
                    track.points.forEach(p => allPoints.push([p.lat, p.lon]));
                });
            }

            // Collect waypoints
            if (currentGPXData.waypoints) {
                currentGPXData.waypoints.forEach(wp => allPoints.push([wp.lat, wp.lon]));
            }

            if (allPoints.length > 0) {
                const bounds = L.latLngBounds(allPoints);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        // Export map as PNG
        async function exportMapPNG() {
            const width = parseInt(document.getElementById('export-width').value) || 2000;
            const height = Math.round(width * 9 / 16); // 16:9 ratio

            const mapElement = document.getElementById('map');

            try {
                const canvas = await html2canvas(mapElement, {
                    width: width,
                    height: height,
                    useCORS: true,
                    allowTaint: true
                });

                // Convert to blob and download
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `gpx-map-${Date.now()}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            } catch (error) {
                console.error('Export failed:', error);
                alert('Export failed. Please try again.');
            }
        }

        // Load database
        async function loadDatabase(event) {
            const file = event.target.files[0];
            if (!file) return;

            const arrayBuffer = await file.arrayBuffer();
            const SQL = await initSqlJs({
                locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}`
            });

            db = new SQL.Database(new Uint8Array(arrayBuffer));

            // Load files
            const result = db.exec('SELECT * FROM files WHERE file_blob IS NOT NULL');
            if (result.length > 0) {
                renderFileList(result[0]);
            }
        }

        // Render file list
        function renderFileList(data) {
            const fileList = document.getElementById('file-list');
            fileList.innerHTML = '';

            const columns = data.columns;
            const rows = data.values;

            rows.forEach((row, idx) => {
                const file = {};
                columns.forEach((col, i) => {
                    file[col] = row[i];
                });

                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-title">
                        <i class="fa-solid fa-route"></i> ${file.title}
                    </div>
                    <div class="file-meta">
                        ${file.upload_date || ''} • ${(file.blob_size / 1024).toFixed(1)} KB
                    </div>
                `;

                item.onclick = () => loadGPXFile(file);
                fileList.appendChild(item);
            });
        }

        // Load and display GPX file
        function loadGPXFile(file) {
            // Mark as active
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Parse GPX
            const gpxText = new TextDecoder().decode(file.file_blob);
            currentGPXData = parseGPX(gpxText);

            // Render on map
            renderGPX(currentGPXData);

            // Build element list
            buildElementList(currentGPXData);

            // Auto-fit
            autoFitMap();
        }

        // Parse GPX (reuse existing parser)
        function parseGPX(gpxText) {
            // ... existing GPX parsing logic ...
            return { tracks: [], routes: [], waypoints: [] };
        }

        // Render GPX on map
        function renderGPX(data) {
            // ... rendering logic with awesome markers ...
        }

        // Build element list
        function buildElementList(data) {
            const elementList = document.getElementById('element-list');
            elementList.innerHTML = '';

            // Add tracks
            data.tracks.forEach((track, idx) => {
                elementList.appendChild(createElementItem('track', track, idx));
            });

            // Add waypoints
            data.waypoints.forEach((wp, idx) => {
                elementList.appendChild(createElementItem('waypoint', wp, idx));
            });
        }

        // Create element item
        function createElementItem(type, data, index) {
            const div = document.createElement('div');
            div.className = 'element-item';
            div.innerHTML = `
                <div class="element-header">
                    <div class="element-title">
                        <i class="fa-solid fa-${type === 'track' ? 'route' : 'location-dot'}"></i>
                        ${data.name || `${type} ${index + 1}`}
                    </div>
                    <input type="checkbox" class="element-toggle" checked>
                </div>
                <div class="element-controls">
                    <!-- Add controls here -->
                </div>
            `;
            return div;
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initMap();
        });
    </script>
</body>
</html>
